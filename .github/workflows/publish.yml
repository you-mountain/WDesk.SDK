name: Publish SDK to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pack
        run: dotnet pack -c Release --no-build --output ./nupkg

      - name: List nupkg
        shell: pwsh
        run: Get-ChildItem -Path "./nupkg" -Filter "*.nupkg" | ForEach-Object { Write-Host $_.FullName }

      - name: Push to NuGet
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem -Path "./nupkg" -Filter "*.nupkg" | Select-Object -First 1
          
          if (-not $nupkg) {
            Write-Error "No .nupkg file found"
            exit 1
          }
          
          Write-Host "Pushing: $($nupkg.FullName)"
          
          dotnet nuget push $nupkg.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate